<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgniNetra | Investigation Dossier</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 40px 30px;
    }
    
    .spine {
      border-left: 3px solid var(--border-medium);
      padding-left: 32px;
    }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }
    
    .brand-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 20px;
      color: var(--text-primary);
    }
    
    .brand-subtitle {
      font-family: var(--font-sans);
      font-size: 12px;
      color: var(--text-secondary);
    }
    
    .back-link {
      color: var(--text-secondary);
      font-family: var(--font-sans);
      font-size: 13px;
      text-decoration: none;
    }
    
    .back-link:hover {
      text-decoration: underline;
    }
    
    .title-block {
      background: var(--bg-surface);
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-md);
      padding: 24px;
      margin-bottom: 32px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    
    .title-text {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 22px;
      color: var(--text-primary);
      letter-spacing: 0.03em;
      margin-bottom: 4px;
    }
    
    .site-id {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-secondary);
    }
    
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    
    .metric-box {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 14px;
    }
    
    .metric-label {
      font-family: var(--font-sans);
      font-size: 11px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }
    
    .metric-value {
      font-family: var(--font-mono);
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .classification-block {
      margin-bottom: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .class-value {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-primary);
      margin-top: 4px;
    }

    .conf-value {
      font-family: var(--font-mono);
      font-size: 20px;
      font-weight: 700;
      color: var(--text-primary);
      margin-top: 4px;
    }

    .risk-bar-track {
      width: 100%;
      height: 8px;
      background: var(--bg-surface-subtle);
      margin: 12px 0 16px;
    }

    .risk-bar-fill {
      height: 100%;
    }

    .risk-high { background: var(--status-danger); }
    .risk-medium { background: var(--status-warning); }
    .risk-low { background: var(--status-success); }

    .ai-disclaimer {
      margin-top: 16px;
    }
    
    .evidence-header {
      margin-bottom: 12px;
    }

    .evidence-title {
      font-family: var(--font-display);
      font-size: 15px;
      color: var(--text-primary);
    }

    .evidence-subtext {
      font-family: var(--font-sans);
      font-size: 12px;
      color: var(--text-secondary);
    }

    .evidence-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .evidence-row {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 11px 14px;
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: 16px;
    }

    .ev-feature {
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .ev-contribution {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      text-align: right;
      color: var(--text-primary);
    }

    .ev-direction {
      font-family: var(--font-sans);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .dir-supports { color: var(--status-success); }
    .dir-opposes { color: var(--status-danger); }

    .interpretation-text {
      font-family: var(--font-sans);
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.7;
      margin-bottom: 20px;
    }
    
    .download-section {
      margin-top: 20px;
    }

    @media (max-width: 800px) {
      .container {
        padding: 20px 15px;
        max-width: none;
      }
      .metric-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .classification-block {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="spine">
    <div class="header">
      <div>
        <div class="brand-title">AgniNetra</div>
        <div class="brand-subtitle">National Thermal Intelligence Platform</div>
      </div>
      <a href="/dashboard/" class="back-link">← Back to Dashboard</a>
    </div>
    
    <div id="content">
      <div style="text-align: center; color: var(--text-muted); font-size: 13px; padding: 40px;">
        Loading investigation dossier...
      </div>
    </div>
  </div>
</div>

<script>
async function loadReport() {
	const h3 = new URLSearchParams(window.location.search).get("h3");
	if (!h3) { showError("No H3 site identifier was provided."); return; }
	try {
		const response = await fetch(`/dossier-data?h3=${encodeURIComponent(h3)}`);
		if (!response.ok) throw new Error("Unable to load risk-site data.");
		const data = await response.json();
		if (data.error) { showError(data.error + ": " + h3); return; }
		const site = {
			h3_cell: data.h3_cell,
			latitude: data.latitude,
			longitude: data.longitude,
			...data.thermal_activity,
			classification: data.legacy_classification.classification,
			classification_confidence: data.legacy_classification.confidence,
			risk_score: data.risk.risk_score,
			priority: data.risk.priority,
			nightfire_match: data.multi_source_evidence.nightfire_match,
			nightfire_matches: data.multi_source_evidence.nightfire_matches,
			no2_mean: data.multi_source_evidence.no2_mean,
			no2_max: data.multi_source_evidence.no2_max,
			ml_classification: data.ml_classification.classification,
			ml_confidence: data.ml_classification.confidence,
			ml_model: data.ml_classification.model,
		};
		renderReport(site);
		renderAIEvidence(data);
	} catch (error) { console.error(error); showError("Unable to load the investigation report.<br><br>" + error.message); }
}

function renderReport(site) {
	const risk = Number(site.risk_score || 0);
	const priority = site.priority || (risk >= 70 ? "HIGH" : risk >= 40 ? "MEDIUM" : "LOW");
	const confidence = Number(site.ml_confidence || 0) * 100;
	const legacyConfidence = Number(site.classification_confidence || 0) * 100;
	const persistence = Number(site.persistence_score || 0) * 100;
	const nightfire = site.nightfire_match ? `YES (${site.nightfire_matches || 0})` : "NO";
	
    let caseStampClass = "case-stamp--low";
    if (priority === "HIGH") caseStampClass = "case-stamp--high";
    else if (priority === "MEDIUM") caseStampClass = "case-stamp--medium";
    
    let riskFillClass = "risk-low";
    if (priority === "HIGH") riskFillClass = "risk-high";
    else if (priority === "MEDIUM") riskFillClass = "risk-medium";

    document.getElementById("content").innerHTML = `
      <div class="title-block">
        <div>
          <div class="title-text">AGNI NETRA INVESTIGATION DOSSIER</div>
          <div class="site-id">Site ID: ${escapeHtml(site.h3_cell || "Unknown")}</div>
        </div>
        <div class="case-stamp ${caseStampClass} case-stamp--just-created">${priority}<br>PRIORITY</div>
      </div>

      <section class="folio">
        <div class="folio-heading">
          <span class="folio-number">Folio I</span>
          <span class="folio-title">Site Identification</span>
        </div>
        <hr class="folio-rule">
        ${row("H3 CELL", escapeHtml(site.h3_cell))}
        ${row("LATITUDE", format(site.latitude, 6))}
        ${row("LONGITUDE", format(site.longitude, 6))}
        ${row("OBSERVED", `${escapeHtml(site.first_detection || "N/A")} → ${escapeHtml(site.last_detection || "N/A")}`)}
      </section>

      <section class="folio">
        <div class="folio-heading">
          <span class="folio-number">Folio II</span>
          <span class="folio-title">Thermal Activity</span>
        </div>
        <hr class="folio-rule">
        <div class="metric-grid">
          <div class="metric-box">
            <div class="metric-label">Detections</div>
            <div class="metric-value">${site.detection_count ?? "N/A"}</div>
          </div>
          <div class="metric-box">
            <div class="metric-label">Active Days</div>
            <div class="metric-value">${site.active_days ?? "N/A"}</div>
          </div>
          <div class="metric-box">
            <div class="metric-label">Persistence</div>
            <div class="metric-value">${persistence.toFixed(1)}%</div>
          </div>
        </div>
        ${row("AVERAGE FRP", format(site.avg_frp, 2) + " MW")}
        ${row("PEAK FRP", format(site.max_frp, 2) + " MW")}
      </section>

      <section class="folio">
        <div class="folio-heading">
          <span class="folio-number">Folio III</span>
          <span class="folio-title">Multi-Source Evidence</span>
        </div>
        <hr class="folio-rule">
        ${row("VIIRS NIGHTFIRE", nightfire)}
        ${row("TROPOMI NO₂ CONTEXTUAL MEAN", format(site.no2_mean, 8))}
        ${row("TROPOMI NO₂ CONTEXTUAL MAXIMUM", format(site.no2_max, 8))}
        ${row("DAYTIME DETECTIONS", site.daytime_detections ?? "N/A")}
        ${row("NIGHTTIME DETECTIONS", site.nighttime_detections ?? "N/A")}
      </section>

      <section class="folio">
        <div class="folio-heading">
          <span class="folio-number">Folio IV</span>
          <span class="folio-title">AI Classification</span>
        </div>
        <hr class="folio-rule">
        <div class="classification-block">
          <div>
            <div class="eyebrow">PROBABLE SOURCE</div>
            <div class="class-value">PROBABLE SOURCE — ${escapeHtml(site.ml_classification || "Unknown").toUpperCase()}</div>
          </div>
          <div>
            <div class="eyebrow">MODEL CONFIDENCE</div>
            <div class="conf-value">${confidence.toFixed(1)}%</div>
          </div>
        </div>
        ${row("MODEL", escapeHtml(site.ml_model || "Unknown"))}
        ${row("PREVIOUS HEURISTIC", escapeHtml(site.classification || "Unknown") + " (" + legacyConfidence.toFixed(1) + "%)")}
        ${row("RISK SCORE", risk.toFixed(2) + " / 100")}
        ${row("PRIORITY", escapeHtml(priority))}
        
        <div class="risk-bar-track">
          <div class="risk-bar-fill ${riskFillClass}" style="width:${Math.min(risk, 100)}%"></div>
        </div>
        
        <div class="disclaimer-notice ai-disclaimer">
          AI-assisted classification. Model output indicates a probable thermal-source category and does not constitute ground-truth verification or regulatory enforcement evidence.
        </div>
      </section>

      <section class="folio" id="aiEvidenceCard">
        <div class="folio-heading">
          <span class="folio-number">Folio V</span>
          <span class="folio-title">Decision Evidence</span>
        </div>
        <hr class="folio-rule">
        <div id="aiEvidence">Loading model evidence...</div>
      </section>

      <section class="folio">
        <div class="folio-heading">
          <span class="folio-number">Folio VI</span>
          <span class="folio-title">Investigation Record</span>
        </div>
        <hr class="folio-rule">
        <div class="interpretation-text">
          AgniNetra combines satellite thermal observations, temporal persistence, fire radiative power, day/night activity and independent atmospheric and thermal-source evidence to prioritize this site for investigation.<br><br>The evidence-based ML system indicates a <strong>probable ${escapeHtml(site.ml_classification || "Unknown")}</strong> source category with model confidence of <strong>${confidence.toFixed(1)}%</strong>. The previous heuristic classification was <strong>${escapeHtml(site.classification || "Unknown")}</strong>. The calculated risk score is <strong>${risk.toFixed(2)} / 100</strong>, resulting in a <strong>${priority}</strong> investigation priority.
        </div>
        <div class="disclaimer-notice">
          <strong>Investigation Disclaimer</strong><br><br>This report is an AI-assisted intelligence product. It identifies and prioritizes locations for further investigation based on satellite-derived evidence. Classification and risk scores are not proof of illegal activity, industrial violations or an active fire. Ground verification and appropriate regulatory investigation are required before enforcement decisions are made.
        </div>
        <div class="download-section">
          <button onclick="downloadReport()" class="btn-ink">DOWNLOAD INVESTIGATION RECORD</button>
        </div>
      </section>
    `;
}

function renderAIEvidence(data) {
	const container = document.getElementById("aiEvidence");
	if (!container) return;

	const explanation = data.ai_explanation;
	if (!explanation || !explanation.features || explanation.features.length === 0) {
		container.innerHTML = '<div style="color: var(--text-muted); font-family: var(--font-sans); font-size: 13px;">No model explanation available for this site.</div>';
		return;
	}

	const rows = explanation.features.map(item => {
		const value = Number(item.shap_value);
		const direction = item.direction === "supports" ? "SUPPORTS" : "OPPOSES";
        const dirClass = item.direction === "supports" ? "dir-supports" : "dir-opposes";
		const feature = item.feature.replaceAll("_", " ").replace(/\b\w/g, character => character.toUpperCase());
		
        return `
        <div class="evidence-row">
          <div class="ev-feature">${escapeHtml(feature)}</div>
          <div class="ev-contribution">${value > 0 ? "+" : ""}${value.toFixed(4)}</div>
          <div class="ev-direction ${dirClass}">${direction}</div>
        </div>
        `;
	}).join("");

	container.innerHTML = `
      <div class="evidence-header">
        <div class="evidence-title">PROBABLE SOURCE — ${escapeHtml(explanation.prediction || "Unknown").toUpperCase()}</div>
        <div class="evidence-subtext">Top model features contributing to this probable source classification</div>
      </div>
      <div class="evidence-list">${rows}</div>
    `;
}

function downloadReport() {
	const h3 = new URLSearchParams(window.location.search).get("h3");
	if (!h3) {
		alert("Site ID not found.");
		return;
	}
	window.location.href = `/report/${encodeURIComponent(h3)}`;
}

function row(label, value) { 
    return `<div class="data-row"><span class="label">${label}</span><span class="value">${value}</span></div>`; 
}

function format(value, decimals) { 
    if (value === null || value === undefined || value === "") return "N/A"; 
    const number = Number(value); 
    return Number.isNaN(number) ? escapeHtml(String(value)) : number.toFixed(decimals); 
}

function escapeHtml(value) { 
    if (value === null || value === undefined) return ""; 
    return String(value).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;"); 
}

function showError(message) { 
    document.getElementById("content").innerHTML = `<div class="disclaimer-notice" style="color: var(--status-danger)"><strong>Investigation Report Error</strong><br><br>${message}</div>`; 
}

loadReport();
</script>
</body>
</html>
